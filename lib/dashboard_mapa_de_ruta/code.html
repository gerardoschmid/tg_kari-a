<script>
        // Simple micro-interaction for tactile buttons
        document.querySelectorAll('.tactile-button').forEach(button => {
            button.addEventListener('mousedown', () => {
                button.style.transform = 'translateY(4px)';
                button.style.borderBottomWidth = '0px';
            });
            button.addEventListener('mouseup', () => {
                button.style.transform = '';
                button.style.borderBottomWidth = '';
            });
            button.addEventListener('mouseleave', () => {
                button.style.transform = '';
                button.style.borderBottomWidth = '';
            });
        });

        // Background decorative effect: subtle drifting leaves or dots
        function createParticle() {
            const particle = document.createElement('div');
            particle.className = 'fixed rounded-full bg-primary opacity-5 pointer-events-none z-0';
            const size = Math.random() * 10 + 5;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${Math.random() * 100}vw`;
            particle.style.top = `${Math.random() * 100}vh`;
            document.body.appendChild(particle);
            
            const duration = Math.random() * 20000 + 10000;
            const animation = particle.animate([
                { transform: 'translate(0, 0)', opacity: 0.05 },
                { transform: `translate(${Math.random() * 200 - 100}px, ${Math.random() * 200 - 100}px)`, opacity: 0 },
            ], {
                duration: duration,
                easing: 'linear'
            });
            
            animation.onfinish = () => {
                particle.remove();
                createParticle();
            };
        }
        
        // Init background particles
        for(let i = 0; i < 15; i++) {
            createParticle();
        }
    </script>
