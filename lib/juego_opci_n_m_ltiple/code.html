<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        
        .tactile-button {
            transition: all 0.1s ease;
            position: relative;
        }
        
        .tactile-button:active {
            transform: translateY(4px);
        }
        
        .tactile-button:active::after {
            height: 0px !important;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 32px;
            border-width: 12px 12px 0;
            border-style: solid;
            border-color: white transparent;
            display: block;
            width: 0;
        }

        @keyframes progress-pop {
            0% { transform: scaleX(0); }
            100% { transform: scaleX(1); }
        }

        .progress-fill {
            animation: progress-pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            transform-origin: left;
        }

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-lg">

</div>
</div>

<!-- Multiple Choice Options -->
<div class="space-y-4">
<!-- Option 1 -->
<button class="tactile-button w-full bg-white border-2 border-outline-variant p-4 rounded-xl flex items-center gap-4 text-left group hover:border-primary/40 transition-all after:content-[''] after:absolute after:bottom-[-6px] after:left-[-2px] after:right-[-2px] after:h-[6px] after:bg-outline-variant after:rounded-b-xl after:z-[-1]">

<span class="font-karina-text text-karina-text text-on-surface">na'nakon</span>

                Comprobar

<script>
        // Micro-interaction for buttons
        document.querySelectorAll('.tactile-button').forEach(button => {
            button.addEventListener('mousedown', () => {
                // Audio feedback could be added here
            });
            
            button.addEventListener('click', function() {
                // If it's an option button, handle selection visual
                if (this.parentNode.classList.contains('space-y-4')) {
                    document.querySelectorAll('.space-y-4 .tactile-button').forEach(b => {
                        // Reset all to default state
                        b.classList.remove('bg-secondary-container/20', 'border-secondary-container');
                        b.classList.add('bg-white', 'border-outline-variant');
                        
                        const indicator = b.querySelector('.ml-auto');
                        if (indicator) indicator.remove();
                        
                        const numBox = b.querySelector('div:first-child');
                        numBox.classList.remove('bg-secondary-container', 'on-secondary-container');
                        numBox.classList.add('border-outline-variant', 'text-on-surface-variant');

                        const afterElement = b.querySelector('.after\\:bg-secondary-container');
                        if(b.classList.contains('after:bg-secondary-container')){
                             b.classList.remove('after:bg-secondary-container');
                             b.classList.add('after:bg-outline-variant');
                        }
                    });

                    // Set this as active (Note: In a real app, this logic would be more robust)
                    // The prompt asked for "na'nakon selected", which we handled in the static HTML
                }
            });
        });

        // Speaker animation
        const speakerBtn = document.querySelector('.material-symbols-outlined[data-icon="volume_up"]').parentElement;
        speakerBtn.addEventListener('click', () => {
            speakerBtn.classList.add('scale-110');
            setTimeout(() => speakerBtn.classList.remove('scale-110'), 200);
        });
    </script>
