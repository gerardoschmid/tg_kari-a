name: karina_app
description: "Proyecto de Tesis - Aprendizaje del Idioma Kariña"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.17.2
  path: ^1.8.3
  path_provider: ^2.1.1
  provider: ^6.0.5
  sqflite: ^2.3.0
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  audioplayers: ^5.2.1
  lottie: ^3.1.0
  http: ^1.1.0 
  shared_preferences: ^2.2.2 
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8
  firebase_remote_config: ^4.3.8
  connectivity_plus: ^5.0.2
  package_info_plus: ^8.0.0
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/flashcards.json
    - assets/images/colors/
    - assets/sounds/colors/
    - assets/animations/
    - assets/images/   

