<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Kariña Learning - Juego de Emparejamiento</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>

            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .active-3d {
            transform: translateY(2px);
            border-bottom-width: 0px !important;
            margin-top: 2px;
        }
        .lesson-card {
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
    </style>

            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#ffffff",
                        "on-primary-container": "#cbffc2",
                        "on-primary": "#ffffff",
                        "tertiary-container": "#cf2f34",
                        "on-secondary-container": "#6e5c00",
                        "on-error": "#ffffff",
                        "surface-tint": "#1b6d24",
                        "outline-variant": "#bfcaba",
                        "inverse-surface": "#2d322b",
                        "secondary-container": "#fcd400",
                        "on-surface": "#181d17",
                        "primary-fixed-dim": "#88d982",
                        "surface-container-low": "#f1f5eb",
                        "on-tertiary-fixed": "#410004",

                        "on-secondary-fixed-variant": "#544600",
                        "surface-container": "#ebefe5",
                        "secondary": "#705d00",
                        "primary-fixed": "#a3f69c",
                        "on-primary-fixed": "#002204",
                        "surface-dim": "#d7dbd2",
                        "inverse-on-surface": "#eef2e8",
                        "on-tertiary-container": "#ffeeec",
                        "on-background": "#181d17",
                        "tertiary-fixed": "#ffdad7",
                        "inverse-primary": "#88d982",
                        "primary": "#0d631b",
                        "surface-bright": "#f7fbf0",
                        "primary-container": "#2e7d32",
                        "surface": "#f7fbf0",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed-dim": "#ffb3ae",
                        "background": "#f7fbf0",
                        "secondary-fixed": "#ffe16d",
                        "on-secondary-fixed": "#221b00",
                        "surface-container-highest": "#e0e4da",
                        "surface-variant": "#e0e4da"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "8px",
                        "button-depth": "4px",
                        "section-margin": "32px",
                        "card-gap": "16px",
                        "container-padding": "24px"
                    },
                    "fontFamily": {
                        "headline-md": ["Plus Jakarta Sans"],
                        "label-caps": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "spanish-translation": ["Plus Jakarta Sans"],
                        "karina-text": ["Plus Jakarta Sans"]

                    "fontSize": {
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                        "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                        "body-lg": ["18px", {"lineHeight": "26px", "fontWeight": "500"}],

            },
        }

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background font-body-lg text-on-surface selection:bg-primary-fixed min-h-screen flex flex-col">
<!-- Top Navigation Bar -->
<header class="fixed top-0 w-full z-50 bg-surface border-b border-outline-variant shadow-sm flex justify-between items-center px-container-padding h-[64px]">
<div class="flex items-center gap-4">
<button class="p-2 hover:bg-surface-container-high rounded-full transition-colors active:translate-y-[2px]">
<span class="material-symbols-outlined text-primary">close</span>
</button>
<div class="h-4 w-48 md:w-64 bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full w-2/3 bg-primary rounded-full transition-all duration-700"></div>
</div>
</div>
<div class="flex items-center gap-2 px-4 py-1.5 bg-surface-container-low rounded-xl border border-outline-variant/30">
<span class="material-symbols-outlined text-tertiary" style="font-variation-settings: 'FILL' 1;">favorite</span>
<span class="font-headline-md text-primary font-bold">5</span>
</div>
</header>
<!-- Main Game Canvas -->
<main class="flex-grow pt-[88px] pb-8 px-container-padding max-w-4xl mx-auto w-full">
<!-- Header Section -->
<section class="mb-section-margin text-center">
<h1 class="font-headline-lg text-headline-lg text-primary mb-2">Empareja las palabras</h1>
<p class="font-body-lg text-on-surface-variant">Selecciona el significado correcto en Kariña</p>
</section>
<!-- Matching Grid -->
<div class="grid grid-cols-2 gap-card-gap md:gap-8">
<!-- Left Column: Spanish -->
<div class="space-y-4">
<button class="lesson-card w-full p-6 bg-surface-container-lowest border-2 border-outline-variant rounded-xl text-left hover:bg-surface-container-low active-3d shadow-sm flex items-center justify-between group transition-all">
<span class="font-karina-text text-on-surface">Ustedes</span>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors">translate</span>
</button>
<button class="lesson-card w-full p-6 bg-surface-container-lowest border-2 border-outline-variant rounded-xl text-left hover:bg-surface-container-low active-3d shadow-sm flex items-center justify-between group transition-all">
<span class="font-karina-text text-on-surface">Lugar</span>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors">translate</span>
</button>
<!-- Active Pair Left -->
<button class="lesson-card w-full p-6 bg-primary-container text-on-primary-container border-2 border-primary rounded-xl text-left shadow-sm flex items-center justify-between transition-all ring-4 ring-primary-fixed/30">
<span class="font-karina-text">Tú</span>
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<button class="lesson-card w-full p-6 bg-surface-container-lowest border-2 border-outline-variant rounded-xl text-left hover:bg-surface-container-low active-3d shadow-sm flex items-center justify-between group transition-all">
<span class="font-karina-text text-on-surface">Él/Ella</span>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors">translate</span>
</button>
</div>
<!-- Right Column: Kariña -->
<div class="space-y-4">
<button class="lesson-card w-full p-6 bg-surface-container-lowest border-2 border-outline-variant rounded-xl text-left hover:bg-surface-container-low active-3d shadow-sm flex items-center justify-between group transition-all">
<span class="font-karina-text text-on-surface">Mojko</span>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors">record_voice_over</span>
</button>
<button class="lesson-card w-full p-6 bg-surface-container-lowest border-2 border-outline-variant rounded-xl text-left hover:bg-surface-container-low active-3d shadow-sm flex items-center justify-between group transition-all">
<span class="font-karina-text text-on-surface">Po</span>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors">record_voice_over</span>
</button>
<!-- Active Pair Right -->
<button class="lesson-card w-full p-6 bg-primary-container text-on-primary-container border-2 border-primary rounded-xl text-left shadow-sm flex items-center justify-between transition-all ring-4 ring-primary-fixed/30">
<span class="font-karina-text">Amooro</span>
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">volume_up</span>
</button>
<button class="lesson-card w-full p-6 bg-surface-container-lowest border-2 border-outline-variant rounded-xl text-left hover:bg-surface-container-low active-3d shadow-sm flex items-center justify-between group transition-all">
<span class="font-karina-text text-on-surface">Amoññaro</span>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors">record_voice_over</span>
</button>
</div>
</div>
<!-- Feedback & Illustration -->
<section class="mt-section-margin flex flex-col md:flex-row items-center gap-8 bg-surface-container-low p-container-padding rounded-[2rem] border border-outline-variant/20">
<div class="w-32 h-32 md:w-48 md:h-48 rounded-2xl overflow-hidden shadow-lg border-4 border-surface-container-lowest shrink-0">
<img alt="Indígena artesano" class="w-full h-full object-cover" data-alt="A detailed digital illustration in a modern, flat vector style featuring a friendly Kariña elder artisan teaching language. The scene is set in a vibrant, sun-drenched outdoor environment with lush green jungle plants and colorful flowers. The character is smiling warmly, wearing traditional woven accessories, and pointing to a wooden board with Kariña scripts. The lighting is bright and cheerful, utilizing a palette of jungle greens, terracotta, and soft mint, evoking a sense of cultural heritage and joyful discovery." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCXyTGwuMrjZ1Tvct0-TtjnHnWIjUIUmHMnAIM8h9NT4li5jGKCmFEyPzJJvyGIQOFkyb40mDmj9V7xEBIKyYLLpAH5JA54MqC8gh7_h4YrkaqZfdOYPOsbDQUELr6M2avaB1a80RO4aeqsN7NGzfOeILWuX2odvtrs44mBXrF-SMbA50CbaEUrLzaHifrLMsQaCloxbx2_jvSxYvaBUxdKpMowv5Bb2DtMI62bfgvHEm7LFAq8k-Tg239QY7ArCdSmSZqOEJlNsEU0"/>
</div>
<div class="text-center md:text-left">
<h3 class="font-headline-md text-primary mb-2">¡Excelente progreso!</h3>
<p class="font-body-lg text-on-surface-variant">Estás dominando los pronombres y conectores básicos del Kariña. Sigue así para desbloquear el siguiente nivel.</p>
</div>
</section>
</main>
<!-- Footer Action -->
<footer class="p-container-padding bg-surface border-t border-outline-variant/30 flex justify-center sticky bottom-0">
<button class="w-full max-w-md py-4 px-8 bg-primary text-on-primary font-headline-md rounded-2xl border-b-[6px] border-primary-container active:border-b-0 active:translate-y-1.5 transition-all shadow-md flex items-center justify-center gap-3">
<span>Comprobar</span>
<span class="material-symbols-outlined">trending_flat</span>
</button>
</footer>
<script>
        // Micro-interactions for tactile feel
        document.querySelectorAll('.lesson-card').forEach(card => {
            card.addEventListener('click', function() {
                if(!this.classList.contains('bg-primary-container')) {
                    // Simple highlight toggle for demo purposes
                    this.classList.toggle('border-primary');
                    this.classList.toggle('bg-primary-fixed/10');
                }
            });
        });

        // Add press effect logic manually to buttons that don't use the tailwind class for complex 3D borders
        const mainBtn = document.querySelector('footer button');
        mainBtn.addEventListener('mousedown', () => {
            mainBtn.style.borderBottomWidth = '0px';
            mainBtn.style.transform = 'translateY(6px)';
        });
        mainBtn.addEventListener('mouseup', () => {
            mainBtn.style.borderBottomWidth = '6px';
            mainBtn.style.transform = 'translateY(0px)';
        });
        mainBtn.addEventListener('mouseleave', () => {
            mainBtn.style.borderBottomWidth = '6px';
            mainBtn.style.transform = 'translateY(0px)';
        });
    </script>
</body></html>
